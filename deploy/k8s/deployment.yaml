apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpserver
  labels:
    app: phpserver
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: phpserver
  template:
    metadata:
      labels:
        app: phpserver
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: phpserver
          image: phpserver:runtime
          imagePullPolicy: IfNotPresent
          args: ["start", "--foreground", "-c", "config/server.echo.php"]
          ports:
            - name: rpc
              containerPort: 9000
            - name: admin
              containerPort: 9100
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
